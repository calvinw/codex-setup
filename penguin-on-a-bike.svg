<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="title desc">
  <title id="title">Penguin on a bike</title>
  <desc id="desc">A cheerful penguin wearing a coral scarf pedals a red bicycle under a sunny sky.</desc>
  <rect width="800" height="640" rx="40" fill="#f1f9fb"/>
  <circle cx="657" cy="113" r="43" fill="#ffdc78"/>
  <g fill="#fff">
    <path d="M97 133a24 24 0 0 1 42-16 33 33 0 0 1 62 12 19 19 0 1 1 4 38H99a17 17 0 0 1-2-34Z"/>
    <path d="M470 84a17 17 0 0 1 30-10 23 23 0 0 1 44 9 14 14 0 1 1 2 28h-75a14 14 0 0 1-1-27Z"/>
  </g>
  <ellipse cx="405" cy="539" rx="281" ry="23" fill="#d5e9ed"/>
