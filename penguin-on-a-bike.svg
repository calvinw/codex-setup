  <path d="M320 222q-18-24-11-50 5-23 24-23 16 0 27 18 11-19 28-16 26 4 31 36 2 20-10 37 34 29 34 64 0 52-59 55-59 2-65-39-6-35 1-82Z" fill="#fffdf5"/>
