      <circle cx="585" cy="438" r="94"/>
    </g>
    <g stroke="#fff" stroke-width="3" opacity=".8">
      <circle cx="224" cy="438" r="83"/>
      <circle cx="585" cy="438" r="83"/>
    </g>
    <!-- Bicycle frame -->
    <path d="m224 438 101-143 70 143H224m101-143h191L395 438m121-143 69 143" stroke="#df3d43" stroke-width="12"/>
    <path d="m325 295-15-34m206 34-21-61 40-16" stroke="#233e50" stroke-width="9"/>
    <path d="m529 219 23-5q18-4 22 12" stroke="#ed7467" stroke-width="12"/>
    <path d="M280 260h62" stroke="#233e50" stroke-width="15"/>
    <circle cx="395" cy="438" r="21" stroke="#233e50" stroke-width="7" fill="#f1f9fb"/>
    <path d="m395 438 28 28h22m-50-28-28-28h-19" stroke="#233e50" stroke-width="7"/>
